<!DOCTYPE html>
<html>
<head>
    <title>Test DXF Export</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px; margin: 5px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005a9c; }
        .log { background: #1e1e1e; color: #fff; padding: 10px; margin: 10px 0; border-radius: 4px; font-family: monospace; height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Test DXF Export</h1>
    <div>
        <button onclick="testFindParts()">Test Find Parts</button>
        <button onclick="testExportSingle()">Test Export Single Sheet</button>
        <button onclick="testExportAll()">Test Export All Sheets</button>
    </div>
    <div class="log" id="log"></div>

    <script>
        // Имитируем минимальную структуру данных для тестирования
        
        function log(msg) {
            const logEl = document.getElementById('log');
            logEl.innerHTML += msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function testFindParts() {
            log('=== Test Find Parts ===');
            
            // Имитируем window.allSheets
            window.allSheets = [{
                sheetNum: 1,
                thickness: 0.8,
                nestedParts: [
                    { partId: 1, x: 100, y: 100, angle: 0, baseWidth: 200, baseHeight: 150 },
                    { partId: 1, x: 300, y: 100, angle: 0, baseWidth: 200, baseHeight: 150 },
                    { partId: 2, x: 100, y: 300, angle: 0, baseWidth: 150, baseHeight: 150 }
                ],
                sheetSize: { width: 1250, height: 2500 },
                partDefinitions: {
                    1: {
                        id: 1,
                        name: 'Деталь 1',
                        bounds: { width: 200, height: 150, minX: 0, minY: 0, maxX: 200, maxY: 150 },
                        objects: [
                            { type: 'line', x1: 0, y1: 0, x2: 200, y2: 0 },
                            { type: 'line', x1: 200, y1: 0, x2: 200, y2: 150 },
                            { type: 'line', x1: 200, y1: 150, x2: 0, y2: 150 },
                            { type: 'line', x1: 0, y1: 150, x2: 0, y2: 0 }
                        ]
                    },
                    2: {
                        id: 2,
                        name: 'Деталь 2',
                        bounds: { width: 150, height: 150, minX: 0, minY: 0, maxX: 150, maxY: 150 },
                        objects: [
                            { type: 'rect', x: 0, y: 0, width: 150, height: 150 }
                        ]
                    }
                }
            }];
            
            window.currentSheetIndex = 0;
            
            // Имитируем nestedParts для экспорта одного листа
            window.nestedParts = window.allSheets[0].nestedParts;
            
            // Имитируем parts
            window.parts = [
                {
                    id: 1,
                    name: 'Деталь 1',
                    thickness: 0.8,
                    objects: window.allSheets[0].partDefinitions[1].objects,
                    bounds: window.allSheets[0].partDefinitions[1].bounds
                },
                {
                    id: 2,
                    name: 'Деталь 2',
                    thickness: 1.0,
                    objects: window.allSheets[0].partDefinitions[2].objects,
                    bounds: window.allSheets[0].partDefinitions[2].bounds
                }
            ];
            
            log('Созданы тестовые данные:');
            log(`- allSheets: ${window.allSheets.length} лист`);
            log(`- nestedParts: ${window.nestedParts.length} деталей`);
            log(`- parts: ${window.parts.length} определений`);
            log(`- partDefinitions в листе: ${Object.keys(window.allSheets[0].partDefinitions).length} определений`);
            
            // Проверяем доступность данных
            log('\nПроверка доступности данных:');
            log(`window.parts доступен: ${!!window.parts}`);
            log(`window.allSheets доступен: ${!!window.allSheets}`);
            log(`window.nestedParts доступен: ${!!window.nestedParts}`);
            
            // Тест поиска деталей
            log('\nТест поиска деталей по partId:');
            nestedParts.forEach(n => {
                const part = window.parts.find(p => p.id == n.partId);
                const partFromDef = window.allSheets[0].partDefinitions[n.partId];
                log(`Деталь #${n.partId}: parts=${!!part}, partDefinitions=${!!partFromDef}`);
            });
        }
        
        function testExportSingle() {
            log('=== Test Export Single Sheet ===');
            
            // Проверяем, есть ли функция exportSheetToDXF
            if (typeof exportSheetToDXF !== 'function') {
                log('ERROR: exportSheetToDXF не определена');
                log('Загрузите svg-export.js в консоли:');
                log('var script = document.createElement("script");');
                log('script.src = "svg-export.js";');
                log('document.head.appendChild(script);');
                return;
            }
            
            // Проверяем наличие тестовых данных
            if (!window.nestedParts || window.nestedParts.length === 0) {
                log('ERROR: Нет тестовых данных. Сначала нажмите "Test Find Parts"');
                return;
            }
            
            try {
                log('Вызов exportSheetToDXF...');
                exportSheetToDXF();
                log('SUCCESS: Функция вызвана без ошибок (проверьте консоль браузера)');
            } catch (e) {
                log(`ERROR: ${e.message}`);
                log(e.stack);
            }
        }
        
        function testExportAll() {
            log('=== Test Export All Sheets ===');
            
            // Проверяем, есть ли функция exportAllSheetsToDXF
            if (typeof exportAllSheetsToDXF !== 'function') {
                log('ERROR: exportAllSheetsToDXF не определена');
                return;
            }
            
            // Проверяем наличие тестовых данных
            if (!window.allSheets || window.allSheets.length === 0) {
                log('ERROR: Нет тестовых данных. Сначала нажмите "Test Find Parts"');
                return;
            }
            
            try {
                log('Вызов exportAllSheetsToDXF...');
                exportAllSheetsToDXF(window.allSheets);
                log('SUCCESS: Функция вызвана без ошибок (проверьте консоль браузера)');
            } catch (e) {
                log(`ERROR: ${e.message}`);
                log(e.stack);
            }
        }
    </script>
</body>
</html>
