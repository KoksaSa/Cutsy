<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Фон -->
  <rect width="1200" height="630" fill="#1e1e1e"/>
  
  <!-- Градиент -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e1e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Заголовок -->
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">Cutsy CAD PRO</text>
  
  <!-- Подзаголовок -->
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="36" fill="#00d4aa">Онлайн CAD программа</text>
  
  <!-- Ключевые преимущества -->
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="28" fill="#cccccc">📐 Автоматическая раскладка (Nesting)</text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="28" fill="#cccccc">📂 Импорт, редактирование и экспорт DXF</text>
  <text x="60" y="420" font-family="Arial, sans-serif" font-size="28" fill="#cccccc">💰 Экономия до 40% материала</text>
  <text x="60" y="470" font-family="Arial, sans-serif" font-size="28" fill="#cccccc">🌐 Работает в браузере</text>
  
  <!-- Декоративные элементы (схематичные детали) -->
  <rect x="800" y="250" width="200" height="150" fill="none" stroke="#00d4aa" stroke-width="4" rx="10"/>
  <circle cx="900" cy="325" r="40" fill="none" stroke="#00d4aa" stroke-width="4"/>
  <polygon points="1050,280 1120,325 1050,370" fill="none" stroke="#00d4aa" stroke-width="4"/>
</svg>
